# Free Supabase projects pause after 7 days without database activity. This reads one row daily.
# The publishable key is public by design (every website visitor's browser receives it).
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 1 * * *"   # daily, 09:17 Philippine time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wtexrwkkijviptexvwmr.supabase.co/rest/v1/hidden_photos?select=photo&limit=1" \
            -H "apikey: sb_publishable_K7YY0SZsMMpqjUIMASgGWQ_6djpugc6")
          echo "Supabase answered $code"
          test "$code" = "200"
